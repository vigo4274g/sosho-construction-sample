</svg>

<header class="header">
  <a href="index.html" class="logo"><svg><use href="#mark"/></svg>SOSHO <small>Inc.</small></a>
  <button class="menu-btn" aria-label="メニュー" aria-expanded="false"><span></span><span></span><span></span></button>
  <nav class="gnav">
    <ul>
      <li><a href="index.html#process"><span class="en">Process</span><span class="ja">一貫施工</span></a></li>

      <li><a href="index.html#company"><span class="en">Company</span><span class="ja">会社概要</span></a></li>
    </ul>
  </nav>
  <div class="hazard"></div>
</header>

<main>
  <section class="page-head">
    <div class="inner"><h1 class="ttl"><span class="en">Contact</span><span class="ja">お問い合わせ・エントリー</span></h1></div>
  </section>
  <form class="form inner" onsubmit="event.preventDefault();alert('サンプルのため送信されません');">
    <label><span>お問い合わせの種類<em>必須</em></span>
      <select name="type" id="type" required><option value="work">工事のご依頼・ご相談</option><option value="partner">協力会社としてのご相談</option><option value="entry">採用へのエントリー</option><option value="other">その他</option></select></label>
    <label><span>会社名</span><input name="company" autocomplete="organization"></label>
    <label><span>お名前<em>必須</em></span><input name="name" required autocomplete="name"></label>
    <label><span>電話番号<em>必須</em></span><input name="tel" type="tel" required autocomplete="tel"></label>
    <label><span>メールアドレス</span><input name="email" type="email" autocomplete="email"></label>
    <label><span>内容<em>必須</em></span><textarea name="message" required placeholder="工事の場所・時期・内容など、わかる範囲でご記入ください"></textarea></label>
    <button type="submit">送信する</button>
    <p class="sample-note">※サンプルのため送信されません</p>
  </form>
</main>
